<main>

<dialog class="lightbox" id="lightbox" aria-label="Work preview">
  <button class="lightbox__close" type="button" aria-label="Close">✕</button>
  <img alt="">
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
/* Isi galeri diambil dari content/<kategori>.json (diatur lewat dashboard Pages CMS).
   main.js baru dimuat setelah judul terisi, karena main.js memecah judul jadi huruf. */
(() => {
  const KEYS = ['photography', 'branding', 'editorial', 'website'];
  const param = new URLSearchParams(location.search).get('c');
  const key = KEYS.includes(param) ? param : KEYS[0];
  const $id = id => document.getElementById(id);
  const shots = $id('shots');
  const dlg = $id('lightbox');
  const big = dlg.querySelector('img');
  dlg.addEventListener('click', () => dlg.close());

  let refreshTimer;
  const refreshSoon = () => {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => window.ScrollTrigger && ScrollTrigger.refresh(), 200);
  };

  const render = data => {
    const title = String(data.title || key).toUpperCase();
    document.title = title.charAt(0) + title.slice(1).toLowerCase() + ' — Ahmad Hafiz Sy';
    $id('catSplit').textContent = title;
    $id('catTitle').setAttribute('aria-label', title);
    $id('catDesc').textContent = data.desc || '';
    $id('catNum').textContent = String(KEYS.indexOf(key) + 1).padStart(2, '0') + ' / 0' + KEYS.length;

    const photos = (Array.isArray(data.photos) ? data.photos : []).filter(p => p && p.image);
    photos.forEach((p, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'shot';
      b.dataset.cursor = 'VIEW';
      const img = document.createElement('img');
      img.src = p.image;
      img.alt = p.caption || title.toLowerCase() + ' work ' + (i + 1);
      img.loading = i < 6 ? 'eager' : 'lazy';
      img.addEventListener('load', refreshSoon);
      b.append(img);
      if (p.caption) {
        const cap = document.createElement('span');
        cap.className = 'shot__cap';
        cap.textContent = p.caption;
        b.append(cap);
      }
      b.addEventListener('click', () => { big.src = p.image; big.alt = img.alt; dlg.showModal(); });
      shots.append(b);
      requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add('is-in')));
    });
    $id('empty').hidden = photos.length > 0;
  };

  fetch('content/' + key + '.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(render)
    .catch(err => { console.error('Gallery data failed to load:', err); $id('empty').hidden = false; })
    .finally(() => {
      const s = document.createElement('script');
      s.src = 'main.js';
      document.body.append(s);
    });
})();
</script>
</body>
</html>

media:
  input: images
  output: /images
  rename: safe
  categories: [image]

content:
  - name: photography
    label: Photography
    type: file
    path: content/photography.json
    fields:
      - name: title
        label: Judul halaman
        type: string
        options:
          maxlength: 40
      - name: desc
        label: Keterangan singkat
        type: text
        options:
          maxlength: 200
      - name: photos
        label: Foto portofolio
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{caption} ({index})"
        fields:
          - name: image
            label: Foto
            type: image
            options:
              path: images/photography
          - name: caption
            label: Keterangan foto (boleh kosong)
            type: string
            options:
              maxlength: 120
